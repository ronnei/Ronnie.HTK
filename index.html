<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script: Vellure Hub - Key System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #18181f;
            border: 1px solid #2d2d3a;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p.sub {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .badge {
            background: #1e3a29;
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #22c55e;
        }
        .key-box {
            background: #0f0f12;
            border: 1px dashed #3f3f50;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 15px;
            user-select: all;
        }
        button {
            background: #00a2ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background: #0082cc;
        }
        .copied {
            display: none;
            color: #4ade80;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Script: Vellure Hub</h1>
        <p class="sub">Hệ thống kích hoạt Key chính thức</p>
        
        <div class="badge">✔ Hiệu lực: Vĩnh viễn | Không giới hạn thiết bị</div>

        <div class="key-box" id="keyText">Vellure-88392104918239</div>

        <button onclick="copyKey()">SAO CHÉP KEY</button>
        <div class="copied" id="copiedMsg">Đã sao chép Key vào bộ nhớ tạm!</div>
    </div>

    <script>
        function copyKey() {
            const key = document.getElementById("keyText").innerText;
            navigator.clipboard.writeText(key).then(() => {
                const msg = document.getElementById("copiedMsg");
                msg.style.display = "block";
                setTimeout(() => { msg.style.display = "none"; }, 3000);
            });
        }
    </script>
</body>
</html>
